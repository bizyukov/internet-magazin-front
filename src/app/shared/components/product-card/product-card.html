<div class="card h-100 product-card">
  <div class="position-relative">
    <img
      [src]="product.imageUrl || 'assets/product-placeholder.jpg'"
      class="card-img-top"
      alt="{{ product.name }}"
    />
    <button
      class="btn btn-icon position-absolute top-0 end-0 m-2"
      [class.text-danger]="isInWishlist"
      (click)="toggleWishlist()"
    >
      <i
        class="bi"
        [class.bi-heart]="!isInWishlist"
        [class.bi-heart-fill]="isInWishlist"
      ></i>
    </button>
  </div>

  <div class="card-body d-flex flex-column">
    <h5 class="card-title">
      <a
        [routerLink]="['/product', product.id]"
        class="text-decoration-none text-dark"
      >
        {{ product.name }}
      </a>
    </h5>

    <div class="d-flex align-items-center mb-2">
      <div class="rating me-2">
        <i
          class="bi bi-star-fill text-warning"
          *ngFor="let star of [1, 2, 3, 4, 5]"
        ></i>
      </div>
      <small class="text-muted">({{ product.reviewsCount || 0 }})</small>
    </div>

    <div class="mt-auto">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="h5 mb-0 text-primary">
          {{ product.price | currency : "RUB" : "symbol" : "1.2-2" }}
        </span>
        <span
          *ngIf="product.oldPrice"
          class="text-muted text-decoration-line-through"
        >
          {{ product.oldPrice | currency : "RUB" : "symbol" : "1.2-2" }}
        </span>
      </div>

      <div class="d-grid">
        <button class="btn btn-outline-primary" (click)="addToCart()">
          <i class="bi bi-cart-plus me-1"></i> В корзину
        </button>
      </div>
    </div>
  </div>

  <ng-content></ng-content>
</div>
