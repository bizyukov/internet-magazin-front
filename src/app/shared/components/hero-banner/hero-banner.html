<div class="hero-banner position-relative mb-5">
  <img
    [src]="imageUrl"
    alt="Promo"
    class="w-100"
    style="height: 400px; object-fit: cover"
  />
  <div class="hero-content position-absolute start-0 bottom-0 p-4 text-white">
    <h2 class="display-4 fw-bold">{{ title }}</h2>
    <p class="lead">{{ subtitle }}</p>
    <button class="btn btn-primary btn-lg">{{ ctaText }}</button>
  </div>
</div>
