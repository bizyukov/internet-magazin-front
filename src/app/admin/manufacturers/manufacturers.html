<div class="card border-0 shadow-sm">
  <div
    class="card-header bg-white d-flex justify-content-between align-items-center"
  >
    <h5 class="mb-0">Управление производителями</h5>
    <div class="d-flex gap-2">
      <input
        type="text"
        class="form-control"
        placeholder="Новый производитель"
        [(ngModel)]="newManufacturerName"
        (keyup.enter)="addManufacturer()"
      />
      <button
        class="btn btn-primary"
        (click)="addManufacturer()"
        [disabled]="!newManufacturerName.trim() || isAdding"
      >
        <span *ngIf="!isAdding">Добавить</span>
        <span *ngIf="isAdding">
          <span class="spinner-border spinner-border-sm"></span>
        </span>
      </button>
    </div>
  </div>

  <div class="card-body">
    <div *ngIf="manufacturers.length === 0" class="text-center py-5">
      <i class="bi bi-building text-muted" style="font-size: 5rem"></i>
      <h5 class="mt-3">Производители не найдены</h5>
      <p class="text-muted">Добавьте производителей для ваших товаров</p>
    </div>

    <div *ngIf="manufacturers.length > 0" class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Кол-во товаров</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let manufacturer of manufacturers">
            <td>{{ manufacturer.id }}</td>
            <td>
              <div *ngIf="editId !== manufacturer.id; else editMode">
                {{ manufacturer.name }}
              </div>
              <ng-template #editMode>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="editName"
                  (keyup.enter)="saveEdit(manufacturer.id)"
                />
              </ng-template>
            </td>
            <td>{{ manufacturer.productCount || 0 }}</td>
            <td>
              <div class="d-flex gap-2" *ngIf="editId !== manufacturer.id">
                <button
                  class="btn btn-sm btn-outline-primary"
                  (click)="startEdit(manufacturer)"
                >
                  <i class="bi bi-pencil"></i>
                </button>
                <button
                  class="btn btn-sm btn-outline-danger"
                  (click)="deleteManufacturer(manufacturer.id)"
                >
                  <i class="bi bi-trash"></i>
                </button>
              </div>
              <div class="d-flex gap-2" *ngIf="editId === manufacturer.id">
                <button
                  class="btn btn-sm btn-outline-success"
                  (click)="saveEdit(manufacturer.id)"
                >
                  <i class="bi bi-check"></i>
                </button>
                <button
                  class="btn btn-sm btn-outline-secondary"
                  (click)="cancelEdit()"
                >
                  <i class="bi bi-x"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
