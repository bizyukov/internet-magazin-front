<div class="admin-layout">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/admin/dashboard">
        <i class="bi bi-shield-lock me-2"></i>Админ-панель
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#adminNavbar"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="adminNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/admin/dashboard"
              routerLinkActive="active"
            >
              <i class="bi bi-speedometer2 me-1"></i>Дашборд
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/admin/products"
              routerLinkActive="active"
            >
              <i class="bi bi-box-seam me-1"></i>Товары
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/admin/categories"
              routerLinkActive="active"
            >
              <i class="bi bi-tags me-1"></i>Категории
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/admin/manufacturers"
              routerLinkActive="active"
            >
              <i class="bi bi-building me-1"></i>Производители
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/admin/orders"
              routerLinkActive="active"
            >
              <i class="bi bi-receipt me-1"></i>Заказы
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/admin/users"
              routerLinkActive="active"
            >
              <i class="bi bi-people me-1"></i>Пользователи
            </a>
          </li>
        </ul>

        <div class="d-flex">
          <a routerLink="/" class="btn btn-outline-light me-2" target="_blank">
            <i class="bi bi-eye me-1"></i>Сайт
          </a>
          <button class="btn btn-outline-danger" (click)="logout()">
            <i class="bi bi-box-arrow-right me-1"></i>Выйти
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Основной контент -->
  <div class="container-fluid mt-4">
    <div class="row">
      <main class="col-md-12">
        <router-outlet></router-outlet>
