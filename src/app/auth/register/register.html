<div class="auth-container">
  <div class="auth-card">
    <div class="text-center mb-4">
      <h2 class="auth-title">Создать аккаунт</h2>
      <p class="text-muted">Заполните информацию для регистрации</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <!-- Name -->
      <app-bootstrap-input
        label="Имя"
        type="text"
        controlName="name"
        placeholder="Иван Иванов"
        [errors]="name?.errors"
        [showErrors]="!!name?.touched"
      ></app-bootstrap-input>

      <!-- Email -->
      <app-bootstrap-input
        label="Email"
        type="email"
        controlName="email"
        placeholder="example@mail.ru"
        [errors]="email?.errors"
        [showErrors]="!!email?.touched"
      ></app-bootstrap-input>

      <!-- Password -->
      <app-bootstrap-input
        label="Пароль"
        type="password"
        controlName="password"
        placeholder="••••••••"
        [errors]="password?.errors"
        [showErrors]="!!password?.touched"
      >
        <div class="mt-2">
          <app-password-strength-meter
            [password]="password?.value || ''"
          ></app-password-strength-meter>
        </div>
      </app-bootstrap-input>

      <!-- Confirm Password -->
      <app-bootstrap-input
        label="Подтвердите пароль"
        type="password"
        controlName="confirmPassword"
        placeholder="••••••••"
        [errors]="confirmPassword?.errors"
        [showErrors]="!!confirmPassword?.touched"
      ></app-bootstrap-input>

      <!-- Password match error -->
      <div
        *ngIf="
          registerForm.hasError('passwordMismatch') && confirmPassword?.touched
        "
        class="alert alert-danger mt-2"
      >
        Пароли не совпадают
      </div>

      <!-- Submit button -->
      <button
        class="btn btn-primary w-100 mb-3"
        type="submit"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Зарегистрироваться</span>
        <span *ngIf="isLoading">
          <span
            class="spinner-border spinner-border-sm"
            aria-hidden="true"
          ></span>
          <span role="status">Загрузка...</span>
        </span>
      </button>

      <!-- Success message -->
      <div *ngIf="successMessage" class="alert alert-success mt-3">
        {{ successMessage }}
      </div>

      <!-- Error message -->
      <div *ngIf="errorMessage" class="alert alert-danger mt-3">
        {{ errorMessage }}
      </div>
    </form>

    <div class="text-center mt-4">
      <p class="mb-0">
        Уже есть аккаунт?
        <a routerLink="/auth/login" class="text-decoration-none fw-medium">
          Войти
        </a>
      </p>
    </div>
  </div>
</div>
