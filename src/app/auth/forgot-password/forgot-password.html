<div class="auth-container">
  <div class="auth-card">
    <div class="text-center mb-4">
      <h2 class="auth-title">Восстановление пароля</h2>
      <p class="text-muted">Введите email для восстановления доступа</p>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <app-bootstrap-input
        label="Email"
        type="email"
        controlName="email"
        placeholder="example@mail.ru"
        [errors]="email?.errors"
        [showErrors]="!!email?.touched"
      ></app-bootstrap-input>

      <!-- Submit button -->
      <button
        class="btn btn-primary w-100 mb-3"
        type="submit"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Отправить инструкции</span>
        <span *ngIf="isLoading">
          <span
            class="spinner-border spinner-border-sm"
            aria-hidden="true"
          ></span>
          <span role="status">Загрузка...</span>
        </span>
      </button>

      <!-- Success message -->
      <div *ngIf="successMessage" class="alert alert-success mt-3">
        {{ successMessage }}
      </div>

      <!-- Error message -->
      <div *ngIf="errorMessage" class="alert alert-danger mt-3">
        {{ errorMessage }}
      </div>
    </form>

    <div class="text-center mt-4">
      <a routerLink="/auth/login" class="text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i> Вернуться ко входу
      </a>
    </div>
  </div>
</div>
